; ===========================================================
; alembic.ini
;
; Alembic configuration — Lavender Trinetra Platform (PostgreSQL)
;
; sqlalchemy.url is intentionally left blank here. The actual
; connection string is loaded from DATABASE_URL in .env at
; runtime by database/migrations/env.py, so this file never
; needs to hard-code credentials.
; ===========================================================

[alembic]
# Path to migration scripts, relative to this file.
script_location = database/migrations

# Template used to generate migration file names.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone used when rendering the "created date" comment in new
# revision files.
timezone = UTC

# Max length of the "slug" derived from the migration message.
truncate_slug_length = 40

# Do not source revision environment for "revision" command by default.
revision_environment = false

# Allow .pyc / .pyo files without a source .py file to be detected as
# revisions in the versions directory.
sourceless = false

# Additional paths to be prepended to sys.path when env.py is run.
prepend_sys_path = .

# Version path separator; "os" uses os.pathsep.
version_path_separator = os

# Left blank on purpose — see database/migrations/env.py, which reads
# DATABASE_URL from .env and sets this dynamically at runtime.
sqlalchemy.url =

[post_write_hooks]
; No post-write formatting hooks configured by default.
; Example (uncomment to enable "black" formatting of new revisions):
; hooks = black
; black.type = console_scripts
; black.entrypoint = black
; black.options = -l 100

# =====================================================================
# Logging configuration
# =====================================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S